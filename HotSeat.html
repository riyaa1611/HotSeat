// ---------- Custom SVG Radar Chart ----------
function RadarChartSVG({ data, max = 10, size = 320 }) {
  const cx = size / 2, cy = size / 2;
  const radius = size * 0.36;
  const N = data.length;
  const angle = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / N;
  const point = (i, v) => {
    const r = (v / max) * radius;
    return [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  };
  const rings = [0.25, 0.5, 0.75, 1];
  const polygon = (vals) => vals.map((v, i) => point(i, v).join(',')).join(' ');
  const dataPoly = polygon(data.map(d => d.score));
  return (
    <svg width="100%" height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: 'visible' }}>
      {rings.map((r, i) => (
        <polygon
          key={i}
          points={polygon(data.map(() => r * max))}
          fill="none" stroke="#2C2C2F" strokeWidth="1"
        />
      ))}
      {data.map((_, i) => {
        const [x, y] = point(i, max);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#2C2C2F" strokeWidth="1" />;
      })}
      <polygon
        points={dataPoly}
        fill="rgba(226, 75, 74, 0.28)"
        stroke="#E24B4A" strokeWidth="2"
        style={{ filter: 'drop-shadow(0 0 8px rgba(226,75,74,0.4))' }}
      />
      {data.map((d, i) => {
        const [px, py] = point(i, d.score);
        return <circle key={i} cx={px} cy={py} r="3" fill="#E24B4A" stroke="#0A0A0B" strokeWidth="1.5" />;
      })}
      {data.map((d, i) => {
        const [lx, ly] = point(i, max + 1.6);
        const a = angle(i);
        const anchor = Math.abs(Math.cos(a)) < 0.2 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
        return (
          <g key={i}>
            <text x={lx} y={ly} textAnchor={anchor} dominantBaseline="middle"
              fill="#9B9A97" fontSize="11" fontFamily="JetBrains Mono, monospace"
              letterSpacing="1" style={{ textTransform: 'uppercase' }}>
              {d.metric}
            </text>
            <text x={lx} y={ly + 14} textAnchor={anchor} dominantBaseline="middle"
              fill="#5F5E5A" fontSize="10" fontFamily="JetBrains Mono, monospace">
              {d.score}/10
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ---------- Hash routing ----------
function useHashRoute() {
  const [route, setRoute] = useState(() => (window.location.hash.replace('#', '') || '/'));
  useEffect(() => {
    const h = () => setRoute(window.location.hash.replace('#', '') || '/');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  const navigate = (path) => { window.location.hash = path; };
  return [route, navigate];
}

// ---------- Toast ----------
function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type = 'error') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 4000);
  }, []);
  const node = toast && (
    <div className="toast" style={{
      borderLeftColor: toast.type === 'error' ? 'var(--accent-red)'
        : toast.type === 'success' ? 'var(--accent-green)' : 'var(--text-secondary)'
    }}>
      <div className="mono" style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.16em', marginBottom: 4 }}>
        {toast.type === 'error' ? 'Error' : toast.type === 'success' ? 'OK' : 'Info'}
      </div>
      <div>{toast.msg}</div>
    </div>
  );
  return { show, node };
}

            <input
              type="url"

        </div>
        {urlError && (

        {/* Repo summary */}
        {parsing && <RepoSkeleton />}

        {/* Personas */}
        <div className="section-divider"><span>02 · Choose Your Interrogator</span></div>

            disabled={!summary || !selectedPersona}
            onClick={handleEnter}
            style={{ minWidth: 280 }}
          >
            <FlameIcon size={16} color="#fff" />

          <div className="mono" style={{ fontSize: 11, color: 'var(--text-muted)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>
            {!summary && !selectedPersona && '› Parse repo · Pick persona'}
            {summary && !selectedPersona && '› Pick a persona to continue'}
            {!summary && selectedPersona && '› Parse a repo to continue'}
            {summary && selectedPersona && '› Average session: 8 minutes'}
          </div>
        </div>
      </main>

      <footer style={{
        borderTop: '1px solid var(--border-default)', padding: '20px 32px',
        display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'var(--text-muted)',
      }}>
        <div className="mono" style={{ letterSpacing: '0.12em', textTransform: 'uppercase' }}>
          No coddling. No participation trophies.
        </div>
        <div className="mono" style={{ letterSpacing: '0.12em' }}>
          🔥 SF · LON · NYC
        </div>
      </footer>
    </div>
  );
}

function SessionPage({ navigate }) {
  const persona = PERSONA_BY_ID[Store.state.persona];
  const repo = Store.state.repoSummary;
  const script = persona ? SCRIPTS[persona.id] : [];
  const TOTAL_QUESTIONS = 12;

  const [messages, setMessages] = useState(() => Store.state.messages.length ? Store.state.messages : [
    { from: 'persona', text: script[0], ts: Date.now() },
  ]);
  const [input, setInput] = useState('');
  const [waiting, setWaiting] = useState(false);
  const [elapsed, setElapsed] = useState(Store.state.elapsed || 0);
  const [turn, setTurn] = useState(1);
  const [isListening, setIsListening] = useState(false);
  const [showLeaveConfirm, setShowLeaveConfirm] = useState(false);
  const [showCompleteOverlay, setShowCompleteOverlay] = useState(false);
  const [voiceSupported] = useState(() => typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition));
  const { show: showToast, node: toastNode } = useToast();

  const chatRef = useRef(null);
  const inputRef = useRef(null);

  // Redirect if no persona
  useEffect(() => {
    if (!persona || !repo) { navigate('/'); }
  }, []);

  // Timer
  useEffect(() => {
    const id = setInterval(() => setElapsed((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  // Auto-scroll
  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages, waiting]);

  if (!persona || !repo) return null;

  const fmtTime = (t) => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;

  const send = () => {
    const text = input.trim();
    if (!text || waiting) return;
    const next = [...messages, { from: 'user', text, ts: Date.now() }];
    setMessages(next);
    setInput('');
    setWaiting(true);

    setTimeout(() => {
      const nextScript = script[turn] || "We're done here. Wait for your report.";
      const isFinal = turn >= script.length;
      setMessages((prev) => [...prev, { from: 'persona', text: nextScript, ts: Date.now() }]);
      setTurn((t) => t + 1);
      setWaiting(false);
      if (isFinal) {
        setTimeout(() => {
          setShowCompleteOverlay(true);
          setTimeout(() => navigate('/report'), 1800);
        }, 600);
      }
    }, 1100 + Math.random() * 600);
  };

  const toggleMic = () => {
    if (!voiceSupported) return;
    if (isListening) { setIsListening(false); return; }
    setIsListening(true);
    // Mock transcription — append text gradually
    const phrases = [
      "So, the way we approach it is",
      "the platform aggregates user activity into",
      "weekly insight digests, but",
      "we're still figuring out monetization.",
    ];
    let i = 0;
    const id = setInterval(() => {
      if (i >= phrases.length) {
        clearInterval(id);
        setIsListening(false);
        return;
      }
      setInput((cur) => (cur ? cur + ' ' : '') + phrases[i]);
      i++;
    }, 700);
  };

  const endEarly = () => {
    if (window.confirm('End session early? You will still get a report.')) {
      navigate('/report');
    }
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {toastNode}
      {/* Header bar */}
      <header style={{
        padding: '14px 24px', borderBottom: '1px solid var(--border-default)',
        display: 'flex', alignItems: 'center', gap: 24, background: 'var(--bg-primary)',
        position: 'sticky', top: 0, zIndex: 5,
      }}>
        <Logo size="sm" />
        <div style={{
          width: 1, height: 22, background: 'var(--border-default)',
        }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span className="live-dot" />
          <span className="mono" style={{ fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>
            Live with
          </span>
          <span style={{ fontWeight: 700, fontSize: 13, letterSpacing: '0.04em' }}>{persona.title}</span>
        </div>

        <div style={{ flex: 1 }} />

        <HeaderStat label="Question" value={`${Math.min(turn, TOTAL_QUESTIONS)} / ${TOTAL_QUESTIONS}`} />
        <HeaderStat label="Elapsed" value={fmtTime(elapsed)} mono icon={<ClockIcon />} />
        <button className="btn btn-ghost" onClick={endEarly} style={{ padding: '8px 14px', fontSize: 12 }}>
          End Session
        </button>
      </header>

      {/* Progress bar */}
      <div style={{ height: 2, background: 'var(--bg-card)' }}>
        <div style={{
          width: `${(Math.min(turn, TOTAL_QUESTIONS) / TOTAL_QUESTIONS) * 100}%`,
          height: '100%', background: 'var(--accent-red)', transition: 'width 400ms ease',
        }} />
      </div>

      {/* Chat */}
      <main ref={chatRef} style={{
        flex: 1, overflowY: 'auto', padding: '32px 24px',
        background: 'radial-gradient(ellipse at top, rgba(226,75,74,0.04), transparent 60%)',
      }}>
        <div style={{ maxWidth: 760, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 18 }}>
          {messages.map((m, i) => (
            <Message key={i} message={m} persona={persona} />
          ))}
          {waiting && (
            <div className="fade-in" style={{ maxWidth: '80%' }}>
              <div className="mono" style={{ fontSize: 10, color: 'var(--text-muted)', marginBottom: 6, letterSpacing: '0.18em', textTransform: 'uppercase' }}>
                {persona.title}
              </div>
              <div className="msg-persona" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '20px 22px' }}>
                <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
              </div>
            </div>
          )}
        </div>
      </main>

      {/* Input area */}
      <div style={{
        borderTop: '1px solid var(--border-default)', background: 'var(--bg-primary)',
        padding: '18px 24px',
      }}>
        <div style={{ maxWidth: 760, margin: '0 auto', display: 'flex', gap: 10, alignItems: 'stretch' }}>
          <div style={{ flex: 1, position: 'relative' }}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder={isListening ? 'Listening…' : 'Type your answer, or hit the mic.'}
              rows={2}
              style={{
                resize: 'none', minHeight: 56,
                borderColor: isListening ? 'var(--accent-red)' : 'var(--border-default)',
              }}
              onKeyDown={(e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
              }}
            />
            <div className="mono" style={{
              position: 'absolute', right: 12, bottom: 8, fontSize: 10,
              color: 'var(--text-muted)', letterSpacing: '0.12em',
            }}>
              ⏎ SEND · ⇧⏎ NEW LINE
            </div>
          </div>
          {voiceSupported && (
            <button
              onClick={toggleMic}
              className={`btn ${isListening ? 'pulse-red' : ''}`}
              style={{
                width: 56, padding: 0,
                background: isListening ? 'var(--accent-red)' : 'var(--bg-input)',
                borderColor: isListening ? 'var(--accent-red)' : 'var(--border-default)',
                color: isListening ? '#fff' : 'var(--text-primary)',
              }}
              aria-label="Toggle microphone"
            >
              <MicIcon size={20} filled={isListening} />
            </button>
          )}
          <button
            onClick={send}
            className="btn btn-primary"
            disabled={!input.trim() || waiting}
            style={{ minWidth: 100 }}
          >
            <SendIcon /> Send
          </button>
        </div>
        {!voiceSupported && (
          <div className="mono" style={{
            maxWidth: 760, margin: '8px auto 0', fontSize: 10,
            color: 'var(--text-muted)', letterSpacing: '0.16em', textTransform: 'uppercase',
          }}>
            ⚠ Voice input requires Chrome
          </div>
        )}
      </div>

      {showCompleteOverlay && (
        <div style={{
          position: 'fixed', inset: 0, background: 'rgba(10,10,11,0.92)',
          display: 'grid', placeItems: 'center', zIndex: 50, animation: 'fadeIn 200ms',
        }}>
          <div style={{ textAlign: 'center' }}>
            <div className="mono" style={{
              fontSize: 11, letterSpacing: '0.3em', color: 'var(--accent-red)', marginBottom: 16,
            }}>SESSION COMPLETE</div>
            <div style={{ fontSize: 36, fontWeight: 800, letterSpacing: '-0.02em', marginBottom: 8 }}>
              You're done here.
            </div>
            <div style={{ color: 'var(--text-secondary)', fontSize: 14 }}>
              Analyzing your performance<span className="typing-dot" style={{ marginLeft: 6 }}/><span className="typing-dot"/><span className="typing-dot"/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function HeaderStat({ label, value, mono, icon }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2 }}>
      <span className="mono" style={{ fontSize: 9, color: 'var(--text-muted)', letterSpacing: '0.22em', textTransform: 'uppercase' }}>

}

          <div>
            <div className="mono" style={{
              fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase',
              color: 'var(--accent-amber)', marginBottom: 8,
            }}>
              Action item · Before next session
            </div>
            <div style={{ fontSize: 17, lineHeight: 1.5, fontWeight: 500 }}>
              {r.homework}
            </div>
          </div>
        </div>

        {/* CTAs */}
        <div style={{
          marginTop: 48, display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap',
        }}>
          <button className="btn btn-primary btn-large" onClick={goAgain}>
            <FlameIcon size={14} color="#fff" /> Go Again
          </button>
          <button className="btn btn-large" onClick={switchPersona}>
            <Refresh /> Switch Persona
          </button>
          <div style={{ flex: 1 }} />
          <button className="btn btn-ghost" onClick={shareResults}>
            Copy Summary
          </button>
        </div>
      </main>
    </div>
  );
}

function FeedbackCard({ title, tone, icon: IconC, items }) {
  const color = tone === 'green' ? 'var(--accent-green)' : 'var(--accent-red)';
  return (
    <div style={{
      background: 'var(--bg-card)', border: '1px solid var(--border-default)',
      padding: '24px 26px',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 18 }}>
        <span style={{ width: 6, height: 6, background: color, display: 'inline-block' }} />
        <span className="mono" style={{
          fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', color: color,
        }}>{title}</span>
      </div>
      <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 14 }}>
        {items.map((x, i) => (
          <li key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start', fontSize: 14, lineHeight: 1.5 }}>
            <span style={{ paddingTop: 3, flexShrink: 0 }}><IconC size={14} color={color} /></span>
            <span>{x}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

// =======================================================
// APP
// =======================================================
function App() {
  const [route, navigate] = useHashRoute();
  const labels = { '/': '01 Home', '/session': '02 Session', '/report': '03 Report' };

  return (
    <div data-screen-label={labels[route] || '01 Home'}>
      {route === '/session' ? <SessionPage navigate={navigate} /> :
       route === '/report' ? <ReportPage navigate={navigate} /> :
       <HomePage navigate={navigate} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
